<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDHProxy</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 1200px; margin: 0 auto; padding: 24px 16px 40px; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; }
    header .sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
    #search { width: min(320px, 100%); }
    .note { color: var(--dim); font-size: 12px; margin: 0 0 14px; }
    .empty { color: var(--muted); }
    [hidden] { display: none !important; }
    footer.disclaimer { margin-top: 32px; }

    /* Tabs like edhplay's filter tabs: plain labels, cyan underline on the selected one. */
    .tabs { display: flex; gap: 4px; margin: 18px 0 16px; border-bottom: 1px solid var(--border); }
    .tabs button { background: none; border-radius: 6px 6px 0 0; height: 38px; padding: 0 14px; font-size: 14px; color: var(--muted);
      position: relative; }
    .tabs button:hover { background: rgba(255, 255, 255, .04); color: var(--strong); }
    .tabs button[aria-selected="true"] { color: #fff; }
    .tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px;
      border-radius: 2px; background: #22d3ee; }

    /* Playmats and sleeves: the same tiles as arts, shaped like the item. */
    #list.arts { display: grid; gap: 14px; }
    #list.playmats { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    #list.sleeves { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .art.wide img { aspect-ratio: 16 / 9; border-radius: 8px; }
    .art.sleeve img, .art.sleeve .matte { aspect-ratio: 274 / 384; border-radius: 4.4% / 3.15%; }
    .matte { width: 100%; background-image: linear-gradient(135deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, .18)),
      radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, .25)); }

    /* Card grid, like edhplay's deck view: one tile per card, alphabetical. */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .cardtile { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .cardtile .pic { position: relative; }
    .cardtile img { width: 100%; aspect-ratio: 488 / 680; object-fit: cover; border-radius: 4.4% / 3.15%; display: block;
      background: rgba(255, 255, 255, .04); transition: transform .15s, box-shadow .15s; }
    .cardtile:hover, .cardtile:focus-visible { background: none; outline: none; }
    .cardtile:hover img, .cardtile:focus-visible img { transform: translateY(-2px); box-shadow: 0 0 0 2px var(--accent); }
    .cardtile .badge { position: absolute; top: 6px; right: 6px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 9999px;
      background: rgba(24, 24, 27, .88); color: var(--strong); }
    .cardtile .title { color: var(--strong); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Dialog in edhplay's style (Chakra dialog: zinc surface, 12px corners, header/body/footer). */
    .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .64); display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 10; }
    .dialog { background: #18181b; border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .08);
      width: min(920px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
    .dialog .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px;
      border-bottom: 1px solid var(--border); }
    .dialog .head h2 { margin: 0; font-size: 18px; font-weight: 600; color: #fff; text-transform: none; letter-spacing: 0; }
    .dialog .head .x { width: 32px; height: 32px; padding: 0; background: transparent; color: var(--muted); font-size: 18px; }
    .dialog .body { padding: 16px 20px; overflow: auto; }
    .dialog .foot { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
    .arts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
    .art { background: rgba(255, 255, 255, .02); box-shadow: inset 0 0 0 1px var(--border); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .art img { width: 100%; aspect-ratio: 488 / 680; object-fit: cover; border-radius: 4.4% / 3.15%; background: rgba(255, 255, 255, .04); display: block; }
    .art .name { color: var(--strong); font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .art .name.unnamed { color: var(--dim); font-style: italic; }
    .art .kind { color: var(--dim); font-size: 11px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { font-size: 11px; line-height: 1; padding: 4px 7px; border-radius: 9999px; background: rgba(255, 255, 255, .06); color: var(--text);
      text-decoration: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a.chip:hover { background: rgba(8, 145, 178, .25); color: #fff; }
    .chip.all { background: rgba(8, 145, 178, .2); color: #67e8f9; }
    .chip.unused { background: transparent; box-shadow: inset 0 0 0 1px var(--border); color: var(--dim); }
    .actions { display: flex; gap: 6px; margin-top: auto; }
    .actions button { height: 28px; padding: 0 10px; font-size: 12px; }
    .ask { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--strong); }
    .ask .row { display: flex; gap: 6px; }
    .art input[type=text] { height: 30px; font-size: 13px; width: 100%; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 data-i18n="mgr_title"></h1>
      <p class="sub" id="summary"></p>
    </div>
    <input type="text" id="search" spellcheck="false">
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="cards" data-i18n="mgr_tabCards"></button>
    <button role="tab" data-tab="playmats" data-i18n="mgr_tabPlaymats"></button>
    <button role="tab" data-tab="sleeves" data-i18n="mgr_tabSleeves"></button>
  </nav>
  <p class="note" id="namesNote" data-i18n="mgr_namesNote" hidden></p>
  <main class="cards" id="list"></main>
  <p class="empty" id="empty" data-i18n="emptyArts" hidden></p>
  <footer class="disclaimer" data-i18n="disclaimer"></footer>
  <script src="i18n.js"></script>
  <script src="manager.js"></script>
</body>
</html>
